<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retail Voice Prompter</title>
  <style>
    :root { --bg:#0b1020; --panel:#151c31; --line:#273250; --ink:#f4f7ff; --muted:#9ca9c9; --accent:#6ea8ff; --red:#ff6e82; }
    * { box-sizing:border-box; } body { height:100vh; overflow:hidden; margin:0; color:var(--ink); background:var(--bg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; gap:12px; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--line); background:#10172a; }
    h1 { margin:0; font-size:18px; letter-spacing:.2px; } h1 span { color:var(--accent); }
    .status { color:var(--muted); font-size:13px; } .status.on { color:#82e6ac; }
    .version { color:var(--muted); font-size:11px; white-space:nowrap; }
    .browser-note { display:block; margin:6px 0 0; color:var(--muted); font-size:10px; font-weight:400; }
    .version { text-align:center; line-height:1.35; }
    main { display:grid; grid-template-columns:350px 1fr; height:calc(100vh - 57px); min-height:0; }
    aside { height:100%; padding:18px; border-right:1px solid var(--line); background:#11182b; overflow:auto; }
    label { display:block; margin:0 0 7px; font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.7px; }
    textarea { width:100%; height:245px; resize:vertical; padding:12px; color:var(--ink); background:#0c1325; border:1px solid var(--line); border-radius:8px; font:14px/1.55 inherit; }
    textarea:focus { outline:2px solid #385d9d; border-color:var(--accent); }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0 19px; }
    button { cursor:pointer; border:1px solid var(--line); border-radius:7px; padding:10px 12px; color:var(--ink); background:#202a45; font-weight:700; }
    button:hover { background:#2a3657; } button.primary { background:#356cc4; border-color:#5790ed; } button.primary:hover { background:#407ae0; } button.stop { background:#6a2637; border-color:#a54359; }
    button.tts { background:#31577f; border-color:#4e7eae; }
    button.tts-active { animation:listeningPulse 1.25s ease-in-out infinite; border-color:#82b8ff; }
    .control { margin:16px 0; } input[type=range] { width:100%; accent-color:var(--accent); } .rangeEnds { display:flex; justify-content:space-between; margin-top:3px; color:var(--muted); font-size:11px; }
    .check { display:flex; gap:9px; align-items:center; color:var(--muted); font-size:14px; margin:13px 0; }
    .hint { padding:11px; border-left:3px solid var(--accent); color:var(--muted); background:#111c35; font-size:13px; }
    .slide-buttons { display:flex; gap:6px; }
    .slide-buttons button { flex:1 1 0; padding:7px 10px; font-size:13px; white-space:nowrap; }
    .slide-buttons button:disabled { opacity:.4; cursor:not-allowed; }
    @keyframes listeningPulse { 0%,100% { box-shadow:0 0 0 0 rgba(110,168,255,.65); } 50% { box-shadow:0 0 0 7px rgba(110,168,255,0); } }
    button.listening { animation:listeningPulse 1.25s ease-in-out infinite; border-color:#82b8ff; }
    .slide-empty { font-size:12px; color:var(--muted); margin:4px 0; }
    #fsSlideNav { flex-basis:100%; min-width:0; }
    #fsSlideNav[hidden] { display:none; }
    #fsSlideButtons { flex-wrap:nowrap; max-width:100%; }
    /* Match scrollbars to the dark navy interface and blue accent. */
    * { scrollbar-width:thin; scrollbar-color:#356cc4 #11182b; }
    *::-webkit-scrollbar { width:10px; height:10px; }
    *::-webkit-scrollbar-track { background:#11182b; }
    *::-webkit-scrollbar-thumb { background:#356cc4; border:2px solid #11182b; border-radius:999px; }
    *::-webkit-scrollbar-thumb:hover { background:#5790ed; }
    textarea::-webkit-scrollbar-track { background:#0c1325; }
    textarea::-webkit-scrollbar-thumb { border-color:#0c1325; }
    body.light-mode { color:#1d2638; background:#eef2f8; }
    body.light-mode header { background:#fff; border-bottom-color:#d8e0ed; }
    body.light-mode h1 span { color:#245aa8; }
    body.light-mode .status { color:#687994; }
    body.light-mode aside { background:#f6f8fc; border-color:#d8e0ed; }
    body.light-mode label, body.light-mode .check { color:#65738a; }
    body.light-mode textarea { color:#1d2638; background:#fff; border-color:#cbd6e6; }
    body.light-mode textarea:focus { outline-color:#6ea8ff; }
    body.light-mode button { color:#234f91; background:#fff; border-color:#cbd6e6; }
    body.light-mode button:hover { background:#e8f1ff; }
    body.light-mode button.primary { color:#fff; background:#356cc4; border-color:#5790ed; }
    body.light-mode button.stop { color:#fff; background:#8f3044; border-color:#ad4a60; }
    body.light-mode .hint { color:#65738a; background:#fff; border-color:#d8e0ed; }
    body.light-mode .slide-empty { color:#718099; }
    body.light-mode section { background:#eaf0f8; }
    body.light-mode .toolbar { background:#fff; border-color:#d8e0ed; }
    body.light-mode .toolbar button { color:#234f91; background:#edf3fc; }
    body.light-mode .toolbar button:hover { background:#dce9fa; }
    body.light-mode #match { color:#234f91; }
    body.light-mode #transcript { color:#687994; }
    body.light-mode #stage { background:#fff; }
    body.light-mode #script { color:#1d2638; }
    body.light-mode .guide { border-color:rgba(53,108,196,.6); }
    body.light-mode * { scrollbar-color:#6d94d0 #e4eaf3; }
    body.light-mode *::-webkit-scrollbar-track { background:#e4eaf3; }
    body.light-mode *::-webkit-scrollbar-thumb { background:#6d94d0; border-color:#e4eaf3; }
    body.light-mode *::-webkit-scrollbar-thumb:hover { background:#356cc4; }
    body.light-mode #fullscreenControls { background:rgba(255,255,255,.95); border-color:#d8e0ed; }
    section { min-width:0; min-height:0; display:flex; flex-direction:column; background:#070b16; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 18px; border-bottom:1px solid var(--line); }
    .toolbar button { padding:7px 10px; font-size:13px; } .toolbar .grow { flex:1; }
    #transcript { color:var(--muted); font-size:13px; max-width:430px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    #stage { position:relative; flex:1; min-height:0; overflow:auto; padding:44vh 9vw; scroll-behavior:auto; }
    #stage.mirror { transform:scaleX(-1); }
    #script { width:100%; margin:0 auto; max-width:none; white-space:pre-wrap; font-weight:650; letter-spacing:.01em; line-height:1.65; font-size:42px; }
    .word { transition:color .18s,background .18s; border-radius:4px; } .word.done { opacity:.42; } .word.current { color:inherit; background:#2d67c3; box-shadow:0 0 0 4px #2d67c3; }
    body.hide-tracking .word.current { background:transparent; box-shadow:none; }
    body.hide-tracking .word.done { opacity:1; }
    #script[contenteditable] { cursor:text; caret-color:var(--accent); outline:none; }
    #script.editing .word { opacity:1; background:transparent; box-shadow:none; }
    .guide { position:fixed; pointer-events:none; top:50%; left:350px; right:0; border-top:1px solid rgba(110,168,255,.6); }
    .header-actions { display:flex; align-items:center; gap:12px; } #fullscreenControls { display:none; }
    #fsTitle { display:none; }
    body.is-fullscreen #fsTitle { position:fixed; z-index:11; top:16px; left:22px; display:block; color:#f4f7ff; font-size:18px; font-weight:700; letter-spacing:.2px; }
    body.is-fullscreen #fullscreenControls { position:fixed; z-index:10; top:16px; right:16px; display:flex; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100vw - 32px); align-items:center; gap:8px; padding:9px; border:1px solid var(--line); border-radius:10px; background:rgba(16,23,42,.94); box-shadow:0 10px 32px rgba(0,0,0,.35); }
    body.is-fullscreen header, body.is-fullscreen aside, body.is-fullscreen .toolbar { display:none; }
    body.is-fullscreen main { display:block; height:100vh; min-height:0; } body.is-fullscreen section { height:100%; min-height:0; overflow:hidden; }
    body.is-fullscreen #stage { height:100%; min-height:0; flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:50vh 9vw; }
    body.is-fullscreen .guide { display:block; left:0; right:0; }
    #fsFont, #fsMargin, #fsAnchor { width:115px; } #fullscreenControls button { padding:8px 10px; white-space:nowrap; } #fullscreenControls .fs-check { display:flex; align-items:center; gap:5px; margin:0; color:var(--muted); font-size:12px; font-weight:700; text-transform:none; letter-spacing:0; white-space:nowrap; }
    @media (max-width:760px) {
      body { height:auto; min-height:100vh; overflow:auto; }
      header { position:sticky; top:0; z-index:20; padding:12px 14px; }
      h1 { font-size:16px; }
      .header-actions { gap:7px; }
      .header-actions button { padding:8px 10px; font-size:12px; }
      main { display:flex; flex-direction:column; height:auto; min-height:calc(100vh - 52px); }
      aside { flex:none; width:100%; height:auto; max-height:none; padding:14px; border-right:0; border-bottom:1px solid var(--line); overflow:visible; }
      textarea { height:180px; min-height:140px; resize:vertical; font-size:14px; }
      .buttons { margin:10px 0 16px; gap:6px; }
      .buttons button { padding:9px 8px; font-size:12px; }
      .control { margin:14px 0; }
      .check { margin:10px 0; }
      .hint { margin-bottom:4px; }
      section { flex:1 1 auto; height:calc(100vh - 390px); min-height:420px; }
      .toolbar { position:sticky; top:0; z-index:5; padding:8px 10px; gap:5px; }
      .toolbar button { padding:6px 9px; font-size:12px; }
      #transcript { max-width:42vw; font-size:11px; }
      #match { font-size:11px; }
      .guide { display:none; }
      #stage { height:100%; min-height:0; padding:28vh 5vw; }
      #script { font-size:32px; line-height:1.55; }
      body.is-fullscreen #fullscreenControls { top:8px; right:8px; max-width:calc(100vw - 16px); gap:5px; padding:7px; }
      body.is-fullscreen #fsTitle { top:12px; left:14px; font-size:16px; }
      body.is-fullscreen #stage { height:100%; min-height:0; padding:50vh 5vw; }
      #fsFont, #fsMargin, #fsAnchor { width:88px; }
      #fullscreenControls button { padding:7px 8px; font-size:12px; }
    }
  </style>
</head>
<body>
  <header><h1><span>Retail Voice Prompter</span></h1><div class="header-actions"><div id="status" class="status">대기 중</div><button id="fullscreen">전체 화면</button></div></header>
  <main>
    <aside>
      <label for="source">대본</label>
      <textarea id="source">[슬라이드 1]
안녕하세요. 지금부터 음성인식 기반 프롬프터를 시연하겠습니다.

[슬라이드 2]
마이크로 읽는 내용을 인식하면, 대본에서 가장 가까운 위치를 찾아 자동으로 따라갑니다. 잠시 멈추거나 문장을 건너뛰어도 다음 문장의 핵심 단어를 말하면 다시 위치를 맞출 수 있습니다.

[슬라이드 3]
발표나 영상 촬영 전에 브라우저의 마이크 권한을 허용해 주세요. 시작 버튼을 누른 뒤 자연스럽게 읽어 보세요.










</textarea>
      <div class="buttons"><button id="render">대본 적용</button><button id="reset">처음으로</button><button id="start" class="primary">인식 시작</button><button id="stop" class="stop">인식 중지</button><button id="ttsStart" class="tts">TTS 재생</button><button id="ttsStop" class="stop">TTS 중지</button></div>
      <nav aria-label="슬라이드 이동"><label>슬라이드 이동</label><div id="slideButtons" class="slide-buttons"><button id="slidePrev" type="button">← 슬라이드 뒤로</button><button id="slideNext" type="button">슬라이드 앞으로 →</button></div></nav>
      <div class="control"><label for="font">글자 크기 <span id="fontValue">42px</span></label><input id="font" type="range" min="24" max="100" value="42" /></div>
      <div class="control"><label for="margin">좌우 여백 <span id="marginValue">보통 (9vw)</span></label><input id="margin" type="range" min="0" max="42" value="9" /><div class="rangeEnds"><span>아주 좁게</span><span>아주 넓게</span></div></div>
      <div class="control"><label for="anchor">인식 기준선 <span id="anchorValue">50%</span></label><input id="anchor" type="range" min="25" max="75" value="50" /></div>
      <label class="check"><input id="mirror" type="checkbox" /> 미러 모드</label>
      <label class="check"><input id="lightMode" type="checkbox" /> 밝은 모드</label>
      <label class="check"><input id="continuous" type="checkbox" checked /> 계속 듣기</label>
      <p class="version">FE. v1.1<span class="browser-note">Chrome에 최적화되어 있습니다.</span></p>
    </aside>
    <section>
      <div class="toolbar"><button id="back">← 이전</button><button id="next">다음 →</button><span class="grow"></span><span id="match">대본 대기</span><span id="transcript">인식된 말이 이곳에 표시됩니다.</span></div>
      <div id="stage"><p id="script" role="document" aria-label="대본 화면" spellcheck="false"></p></div><div class="guide"></div>
    </section>
  </main>
  <div id="fsTitle" aria-hidden="true">Retail Voice Prompter</div>
  <div id="fullscreenControls" aria-label="전체 화면 조작">
    <nav id="fsSlideNav" aria-label="전체 화면 슬라이드 이동" hidden><div id="fsSlideButtons" class="slide-buttons"><button id="fsSlidePrev" type="button">← 슬라이드 뒤로</button><button id="fsSlideNext" type="button">슬라이드 앞으로 →</button></div></nav>
    <button id="fsSmaller" title="글자 작게">A−</button><input id="fsFont" type="range" min="24" max="100" value="42" aria-label="글자 크기" /><button id="fsLarger" title="글자 크게">A+</button><label class="fs-check" for="fsMargin">여백 <span id="fsMarginValue">보통</span></label><input id="fsMargin" type="range" min="0" max="42" value="9" aria-label="좌우 여백" /><label class="fs-check" for="fsAnchor">기준선 <span id="fsAnchorValue">50%</span></label><input id="fsAnchor" type="range" min="25" max="75" value="50" aria-label="인식 기준선" />
    <button id="fsReset">처음으로</button><button id="fsStart" class="primary">인식 시작</button><button id="fsStop" class="stop">인식 중지</button><button id="fsTtsStart" class="tts">TTS 재생</button><button id="fsTtsStop" class="stop">TTS 중지</button><label class="fs-check"><input id="fsMirror" type="checkbox" /> 미러 모드</label><label class="fs-check"><input id="fsContinuous" type="checkbox" checked /> 계속 듣기</label><label class="fs-check"><input id="fsLightMode" type="checkbox" /> 밝은 모드</label><button id="exitFullscreen">나가기</button>
  </div>
  <script>
    const $ = s => document.querySelector(s);
    const source=$('#source'), script=$('#script'), stage=$('#stage'), guide=$('.guide'), status=$('#status'), transcript=$('#transcript'), match=$('#match');
    let editingScript=false, trackingVisible=true, editCaretOffset=null;
    function toggleTracking(){
      trackingVisible=!trackingVisible;
      document.body.classList.toggle('hide-tracking',!trackingVisible);
      ['#trackingToggle','#fsTrackingToggle'].forEach(id=>{ $(id).textContent=trackingVisible?'인식 표시 숨기기':'인식 표시 보이기'; $(id).setAttribute('aria-pressed',String(!trackingVisible)); });
    }
    function finishScriptEdit(){
      if(!editingScript) return;
      source.value=script.innerText; editingScript=false; script.classList.remove('editing');
      script.removeAttribute('contenteditable'); script.setAttribute('role','document'); script.removeAttribute('aria-multiline');
      render(true);
      ['#editScript','#fsEditScript'].forEach(id=>{ $(id).textContent='본문 수정'; $(id).setAttribute('aria-pressed','false'); });
      status.textContent='대본 수정 완료';
    }
    function beginScriptEdit(){
      if(editingScript) return;
      const offset=Math.max(0,Math.min(source.value.length,editCaretOffset??words[current]?.start??0));
      stopTts(); stopRecognition(); cancelAnimationFrame(scrollFrame); scrollFrame=0; scrollTarget=null;
      editingScript=true; script.classList.add('editing');
      script.textContent=source.value; script.setAttribute('contenteditable','plaintext-only');
      script.setAttribute('role','textbox'); script.setAttribute('aria-multiline','true');
      const scrollTop=stage.scrollTop; script.focus({preventScroll:true});
      if(script.firstChild){
        const range=document.createRange(); range.setStart(script.firstChild,offset); range.collapse(true);
        const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
      }
      stage.scrollTop=scrollTop;
      ['#editScript','#fsEditScript'].forEach(id=>{ $(id).textContent='수정 완료'; $(id).setAttribute('aria-pressed','true'); });
      status.textContent='대본 수정 중';
    }
    function toggleScriptEdit(){ if(editingScript) finishScriptEdit(); else beginScriptEdit(); }
    function rememberEditPosition(event,index){
      editCaretOffset=words[index]?.start??0;
      const caret=document.caretRangeFromPoint?.(event.clientX,event.clientY);
      if(caret && script.contains(caret.startContainer)){
        const before=caret.cloneRange(); before.selectNodeContents(script); before.setEnd(caret.startContainer,caret.startOffset);
        editCaretOffset=before.toString().length;
      }
    }
    function resetToStart(){
      finishScriptEdit(); stopTts(); cancelAnimationFrame(scrollFrame); scrollFrame=0; scrollTarget=null; lastScrollFrame=0;
      lastVoiceTarget=null; lastVoiceAt=0; setCurrent(0,false);
      stage.scrollTop=0; visibleBoundsDirty=true;
      if(listening) restartRecognitionFromAnchor();
      match.textContent='대본 대기';
    }
    let words=[], wordEls=[], current=-1, recognition, listening=false, shouldListen=false, restartTimer, retryCount=0, scrollFrame, scrollTarget=null, lastScrollFrame=0, scrollSpeed=520, lastVoiceTarget=null, lastVoiceAt=0, anchorRatio=.5, restartAfterAnchor=false, allowCurrentMatch=false;
    let recognitionPhase='idle', pendingStart=false, recognitionError='';
    let recognitionWatchdog, phaseChangedAt=0, recognitionHadError=false;
    let ttsActive=false, ttsChunks=[], ttsIndex=0, ttsWordMap=[], ttsWordCursor=0;
    const normalize = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
    const compact = s => normalize(s).replace(/\s/g,'');
    const escapeHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let slides=[], lastResultCount=0, resultFloor=0, visibleBoundsCache, visibleBoundsDirty=true, matchMemo=null;
    function buildSlideButtons(){
      slides=[];
      for(const marker of source.value.matchAll(/\[\s*슬라이드\s*(\d+)\s*\]/g)){
        const wordIndex=words.findIndex(w=>w.end>marker.index);
        if(wordIndex>=0) slides.push({label:'슬라이드 '+marker[1],wordIndex});
      }
      $('#fsSlideNav').hidden=slides.length===0;
      updateSlideButtons();
    }
    function updateSlideButtons(){
      let active=-1;
      slides.forEach((slide,index)=>{if(slide.wordIndex<=current) active=index;});
      const atFirst=active<=0, atLast=slides.length===0 || active>=slides.length-1;
      ['#slidePrev','#fsSlidePrev'].forEach(id=>$(id).disabled=slides.length===0 || atFirst);
      ['#slideNext','#fsSlideNext'].forEach(id=>$(id).disabled=atLast);
    }
    function stepSlide(delta){
      finishScriptEdit();
      if(!slides.length) return;
      let active=-1;
      slides.forEach((slide,index)=>{if(slide.wordIndex<=current) active=index;});
      if(active<0){ if(delta>0) jumpToSlide(0); return; }
      const target=Math.max(0,Math.min(slides.length-1,active+delta));
      if(target!==active) jumpToSlide(target);
    }
    function jumpToSlide(index){
      const slide=slides[index]; if(!slide) return;
      cancelAnimationFrame(scrollFrame); scrollFrame=0; scrollTarget=null; lastScrollFrame=0;
      lastVoiceTarget=null; lastVoiceAt=0;
      setCurrent(slide.wordIndex,false);
      const box=wordEls[current].getBoundingClientRect();
      stage.scrollTop=Math.max(0,Math.min(stage.scrollHeight-stage.clientHeight,
        stage.scrollTop+box.top+box.height/2-window.innerHeight*anchorRatio));
      visibleBoundsDirty=true;
      restartRecognitionFromAnchor();
      match.textContent=slide.label+'부터 '+(listening?'음성 추적':'읽기');
      transcript.textContent='이동한 슬라이드의 대본을 읽어 주세요.';
    }
    function render(keepPosition=false){
      cancelAnimationFrame(scrollFrame); scrollFrame=0; scrollTarget=null;
      matchMemo=null; editCaretOffset=null;
      const previousPosition=current;
      let wordIndex=0; words=[];
      script.innerHTML=Array.from(source.value.matchAll(/\S+|\s+/g), match=>{
        const raw=match[0];
        if(/^\s+$/.test(raw)) return escapeHtml(raw);
        const word={raw,key:compact(raw),i:wordIndex++,start:match.index,end:match.index+raw.length}; words.push(word);
        return `<span class="word" data-i="${word.i}">${escapeHtml(raw)}</span>`;
      }).join('');
      wordEls=Array.from(script.querySelectorAll('.word')); visibleBoundsDirty=true; buildSlideButtons(); current=-1; setCurrent(keepPosition?Math.max(0,previousPosition):0,false); updateSlideButtons();
    }
    function setCurrent(i, scroll=true, source='manual'){
      if(!words.length) return; const previous=current; current=Math.max(0,Math.min(i,words.length-1));
      // Update only the range affected by this move instead of repainting every
      // word on each interim speech-recognition result.
      const from=Math.max(0,Math.min(previous,current)), to=Math.min(words.length-1,Math.max(previous,current));
      for(let n=from;n<=to;n++) wordEls[n].className='word '+(n<current?'done':n===current?'current':'');
      updateSlideButtons();
      const el=wordEls[current]; if(scroll&&el) followScrollTo(el,source==='voice'||source==='tts');

    function followScrollTo(el, voiceDriven=false){

      transcript.textContent=restarted?'새 위치부터 말해 주세요.':'인식 시작 후 클릭 위치부터 말해 주세요.';
    });
    $('#start').onclick=()=>{ stopTts(); startRecognition(); }; $('#fsStart').onclick=()=>{ stopTts(); startRecognition(); }; $('#stop').onclick=stopRecognition; $('#fsStop').onclick=stopRecognition;
    $('#ttsStart').onclick=startTts; $('#fsTtsStart').onclick=startTts; $('#ttsStop').onclick=stopTts; $('#fsTtsStop').onclick=stopTts;
    $('#fsReset').onclick=()=>{ stopTts(); setCurrent(0); match.textContent='대본 대기';}; $('#fsSmaller').onclick=()=>setFont(Number($('#fsFont').value)-2); $('#fsLarger').onclick=()=>setFont(Number($('#fsFont').value)+2);
    $('#fullscreen').onclick=enterFullscreen; $('#exitFullscreen').onclick=()=>document.exitFullscreen(); document.addEventListener('fullscreenchange',syncFullscreen);
    for(const [container,prefix] of [[$('.toolbar'),''],[$('#fullscreenControls'),'fs']]){
      const toggle=document.createElement('button'); toggle.id=prefix?'fsTrackingToggle':'trackingToggle'; toggle.textContent='인식 표시 숨기기'; toggle.setAttribute('aria-pressed','false'); toggle.onclick=toggleTracking; container.appendChild(toggle);
      const edit=document.createElement('button'); edit.id=prefix?'fsEditScript':'editScript'; edit.textContent='본문 수정'; edit.setAttribute('aria-pressed','false'); edit.onclick=toggleScriptEdit; container.appendChild(edit);
    }
    $('#reset').onclick=resetToStart; $('#fsReset').onclick=resetToStart;
    $('#render').onclick=()=>{ if(editingScript) finishScriptEdit(); else { stopTts(); render(); } };
    render(); setFont(42); setMargin(9); setAnchor(50,false); setMirror(false); setContinuous(true); setLightMode((()=>{try{return localStorage.getItem('retailVoiceLightMode')==='1';}catch(_){return false;}})()); updateTtsUI(false);
  </script>
</body>
